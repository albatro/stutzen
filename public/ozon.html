<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Stutzen — товары Ozon</title>
  <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_simple.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 12px 16px; color: #222; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .bar input, .bar select, .bar button { padding: 6px 10px; font-size: 14px; }
    .bar input[type=text] { width: 260px; }
    button { background: #ffcc00; border: none; cursor: pointer; border-radius: 4px; }
    button:disabled { background: #ddd; cursor: wait; }
    #progress {
      display: none;
      background: #f0f7ff;
      border: 1px solid #b3d1f5;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    #progress.visible { display: block; }
    #progress .pr-title { font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    #progress .pr-phases { display: flex; gap: 24px; flex-wrap: wrap; }
    #progress .pr-phase { display: flex; flex-direction: column; gap: 2px; }
    #progress .pr-phase-name { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .04em; }
    #progress .pr-phase-val { font-size: 18px; font-weight: 700; color: #1a73e8; }
    #progress .pr-phase-val.done { color: #34a853; }
    #progress .pr-phase-val.idle { color: #bbb; font-weight: 400; font-size: 14px; }
    #progress .pr-err { color: #c00; margin-top: 6px; font-size: 12px; }
    #progress .pr-elapsed { font-size: 12px; color: #888; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; animation: spin 1s linear infinite; }
    .stats { font-size: 13px; color: #555; }
    #table { height: calc(100vh - 130px); }
    .thumb { width: 40px; height: 40px; object-fit: contain; }

    .tabulator .tabulator-header,
    .tabulator .tabulator-header-contents,
    .tabulator .tabulator-headers { height: auto !important; }

    .tabulator .tabulator-header .tabulator-col,
    .tabulator .tabulator-header .tabulator-col .tabulator-col-content,
    .tabulator .tabulator-header .tabulator-col-resize-handle {
      height: auto !important;
      min-height: 56px;
    }

    .tabulator .tabulator-header .tabulator-col .tabulator-col-title-holder,
    .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: clip !important;
      line-height: 1.2;
      word-break: normal;
    }

    .tabulator .tabulator-header .tabulator-col .tabulator-col-content {
      padding: 6px 8px;
    }

    .gear-wrap { position: relative; display: inline-block; }
    .gear-btn {
      background: #f0f0f0;
      padding: 6px 10px;
      font-size: 16px;
      line-height: 1;
    }
    .gear-panel {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      padding: 8px 12px;
      z-index: 100;
      max-height: 70vh;
      overflow-y: auto;
      min-width: 240px;
    }
    .gear-panel.open { display: block; }
    .gear-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .gear-panel .gear-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid #eee;
      padding-top: 8px;
      margin-top: 6px;
    }
    .gear-panel .gear-actions button {
      background: #f0f0f0;
      font-size: 12px;
      padding: 4px 8px;
    }

    /* Расшифровка «К перечислению» */
    .calc-tip {
      display: none;
      position: fixed;
      background: #1e2433;
      color: #dde1ef;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.85;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 6px 28px rgba(0,0,0,.45);
      min-width: 270px;
    }
    .calc-tip .tip-row { display: flex; justify-content: space-between; gap: 28px; }
    .calc-tip .tip-val { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .calc-tip .tip-sep { border-top: 1px solid rgba(255,255,255,.15); margin: 6px 0; }
    .calc-tip .tip-total { font-weight: 700; font-size: 13px; }
    .calc-tip .tip-pos .tip-val { color: #4ade80; }
    .calc-tip .tip-neg .tip-val { color: #f87171; }

    /* Логи синхронизации */
    #sync-logs {
      border: 1px solid #e5e5e5; border-radius: 6px;
      padding: 10px 14px; margin-bottom: 10px; font-size: 13px;
    }
    #sync-logs summary { cursor: pointer; font-weight: 600; user-select: none; }
    #sync-logs .sched { color: #555; margin: 6px 0 8px; }
    #sync-logs .cron-badge { display: inline-block; padding: 1px 8px; border-radius: 3px; background: #eef4ff; color: #06c; font-family: monospace; font-size: 12px; }
    #sync-logs table { border-collapse: collapse; width: 100%; }
    #sync-logs th, #sync-logs td { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; }
    #sync-logs th { font-size: 11px; font-weight: 600; color: #888; background: #fafafa; }
    #sync-logs td.r { text-align: right; font-variant-numeric: tabular-nums; }
    #sync-logs .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
    #sync-logs .badge.success { background: #d4edda; color: #155724; }
    #sync-logs .badge.partial { background: #fff3cd; color: #856404; }
    #sync-logs .badge.error, #sync-logs .badge.failed { background: #f8d7da; color: #721c24; }
    #sync-logs .badge.running { background: #fff3cd; color: #856404; }
    #sync-logs .err-txt { color: #c00; font-family: monospace; font-size: 11px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Товары Ozon</h1>
  <div style="font-size:13px;margin-bottom:8px;">
    <a href="/" style="color:#06c;text-decoration:none;margin-right:12px;">Я.Маркет</a>
    <a href="/supplier.html" style="color:#06c;text-decoration:none;margin-right:12px;">Поставщик</a>
    <a href="/markup.html" style="color:#06c;text-decoration:none;margin-right:12px;">Наценка</a>
    <a href="/price-sync.html" style="color:#06c;text-decoration:none;margin-right:12px;">Сверка цен</a>
    <a href="/sales.html" style="color:#06c;text-decoration:none;margin-right:12px;">Продажи</a>
    <a href="/cancellations.html" style="color:#06c;text-decoration:none;margin-right:12px;">Отмены</a>
    <a href="/feed-logs.html" style="color:#06c;text-decoration:none;margin-right:12px;">Логи фидов</a>
    <a href="/feed-view.html" style="color:#06c;text-decoration:none;margin-right:12px;">Смотреть фид</a>
    <a href="/supplier-feed.html" style="color:#06c;text-decoration:none;margin-right:12px;">Входящий фид</a>
    <a href="/events.html" style="color:#06c;text-decoration:none;margin-right:12px;">События</a>
    <a href="/ozon.html" style="color:#222;font-weight:bold;text-decoration:underline;">Ozon</a>
    <a href="/ozon-profit.html" style="color:#06c;text-decoration:none;margin-left:12px;">Рентабельность</a>
    <a href="/ozon-markup.html" style="color:#06c;text-decoration:none;margin-left:12px;">Наценка</a>
    <a href="/ozon-price.html" style="color:#06c;text-decoration:none;margin-left:12px;">Цены</a>
    <a href="/ozon-bulk-prices.html" style="color:#06c;text-decoration:none;margin-left:12px;">Авто-цены</a>
  </div>
  <div class="bar">
    <input id="search" type="text" placeholder="поиск по SKU / названию">
    <select id="category"><option value="">Все категории</option></select>
    <button id="refresh">Обновить таблицу</button>
    <button id="sync">Запустить синхронизацию Ozon</button>
    <span class="gear-wrap">
      <button class="gear-btn" title="Настройка колонок">&#9881;</button>
      <div class="gear-panel"></div>
    </span>
    <span id="stats" class="stats"></span>
  </div>
  <details id="sync-logs">
    <summary>История синхронизации Ozon</summary>
    <div class="sched">
      Расписание: <span id="sl-cron" class="cron-badge">—</span>
      <span id="sl-next" style="color:#555;margin-left:8px;"></span>
    </div>
    <div id="sl-table"><span style="color:#aaa">Загрузка…</span></div>
  </details>

  <div id="progress">
    <div class="pr-title"><span class="spinner">⟳</span> <span id="pr-label">Синхронизация…</span> <span class="pr-elapsed" id="pr-elapsed"></span></div>
    <div class="pr-phases">
      <div class="pr-phase"><span class="pr-phase-name">Товары</span><span class="pr-phase-val" id="pr-products">—</span></div>
      <div class="pr-phase"><span class="pr-phase-name">Цены</span><span class="pr-phase-val" id="pr-prices">—</span></div>
      <div class="pr-phase"><span class="pr-phase-name">Остатки</span><span class="pr-phase-val" id="pr-stocks">—</span></div>
      <div class="pr-phase"><span class="pr-phase-name">Комиссии</span><span class="pr-phase-val" id="pr-commissions">—</span></div>
      <div class="pr-phase"><span class="pr-phase-name">Ошибок</span><span class="pr-phase-val" id="pr-errors">0</span></div>
    </div>
    <div class="pr-err" id="pr-errmsg"></div>
  </div>
  <div id="table"></div>
  <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
  <script src="/ozon.js"></script>
</body>
</html>
